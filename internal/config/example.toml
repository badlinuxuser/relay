# Relay configuration. This file is created automatically on first run.
# API keys are NOT stored here: add them with `relay keys` (or /keys in the UI),
# which opens a page in your browser. Keys are saved to keys.json and persist between sessions.

listen = "127.0.0.1:8787"     # backend address (also the OpenAI-compatible gateway at /v1)
default_mode = "small"        # small | medium | hard | maximum
# workspace = "/path/to/project"  # by default the agent works in the folder where relay was started

# ---------------------------------------------------------------- providers
# kind = "openai"    any OpenAI-compatible server: Ollama, llama.cpp, LM Studio,
#                    vLLM, OpenAI, OpenRouter, Gemini (via /v1beta/openai)
# kind = "anthropic" Anthropic Messages API
# You can add several keys per provider: on a rate limit Relay moves to the next key,
# and when keys run out, to the next model of the mode.
# Providers without any key are skipped silently, so you only need keys for the ones you use.
# api_key_env (optional): also read keys from environment variables,
#                    e.g. api_key_env = ["ANTHROPIC_API_KEY"].
# Local servers (localhost) need no key.

[[providers]]
name = "ollama"
kind = "openai"
base_url = "http://127.0.0.1:11434/v1"

[[providers]]
name = "llamacpp"
kind = "openai"
base_url = "http://127.0.0.1:8080/v1"

[[providers]]
name = "anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com"

[[providers]]
name = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"

[[providers]]
name = "gemini"
kind = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"

[[providers]]
name = "openrouter"
kind = "openai"
base_url = "https://openrouter.ai/api/v1"

# ------------------------------------------------------------------- models
# price_in / price_out: USD per 1M tokens (used for cost tracking, fill in yourself)
# tools = true: the model can call tools (required for agent mode)
# You do NOT have to list models here. Relay asks every provider you added a key for
# (and local servers like Ollama) which models they serve; they all appear in the /model
# list as "provider/name" and are used as fallbacks automatically. Entries below are just
# short aliases for the modes; an alias whose model the provider does not serve is skipped.

[[models]]
id = "local-small"
provider = "ollama"
model = "qwen2.5-coder:7b"
tier = "small"
tools = true
context = 32768

[[models]]
id = "haiku"
provider = "anthropic"
model = "claude-haiku-5-5"
tier = "small"
tools = true
context = 200000

[[models]]
id = "sonnet"
provider = "anthropic"
model = "claude-sonnet-5-5"
tier = "medium"
tools = true
context = 200000

[[models]]
id = "opus"
provider = "anthropic"
model = "claude-opus-5-5"
tier = "hard"
tools = true
context = 200000

# ------------------------------------------------------------------- modes
# A mode defines the UI/mascot color and the model chain: if the first model is
# unavailable (rate limit, server error, no key), the next one is used. After the chain,
# Relay falls back to one discovered model from every other provider that has a key.

[modes.small]
models = ["local-small", "haiku"]
max_steps = 10

[modes.medium]
models = ["sonnet", "haiku"]
max_steps = 16

[modes.hard]
models = ["opus", "sonnet"]
max_steps = 24

[modes.maximum]
models = ["opus", "sonnet"]
max_steps = 40

# ---------------------------------------------------------- local processes
# Launcher: start and stop local servers from the UI (/start, /stop).
# If the server is already running (for example the system Ollama service),
# Relay attaches to it and does not start a second copy.

[[processes]]
name = "ollama"
command = "ollama"
args = ["serve"]
ready_url = "http://127.0.0.1:11434/api/tags"
autostart = false

