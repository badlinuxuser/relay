# Relay configuration. This file is created automatically on first run.
# API keys are NOT stored here: add them with `relay keys` (or /keys in the UI),
# which opens a page in your browser. Keys are saved to keys.json and persist between sessions.

listen = "127.0.0.1:8787"     # backend address (also the OpenAI-compatible gateway at /v1)
default_mode = "small"        # small | medium | hard | maximum
# workspace = "/path/to/project"  # by default the agent works in the folder where relay was started

# ---------------------------------------------------------------- providers
# kind = "openai"    any OpenAI-compatible server: Ollama, llama.cpp, LM Studio,
#                    vLLM, OpenAI, OpenRouter, Gemini (via /v1beta/openai)
# kind = "anthropic" Anthropic Messages API
# You can add several keys per provider: on a rate limit Relay moves to the next key,
# and when keys run out, to the next model of the mode.
# Providers without any key are skipped silently, so you only need keys for the ones you use.
# api_key_env (optional): also read keys from environment variables,
#                    e.g. api_key_env = ["ANTHROPIC_API_KEY"].
# Local servers (localhost) need no key.
#
# Models are found automatically: Relay asks each provider which models it has
# (what is installed in Ollama, what Ollama cloud and the Gemini API offer for your
# key, ...) and shows them in /models as <provider>/<model>, for example
# ollama/granite4.1:3b or gemini/gemini-2.5-flash. You do not have to list them below.
# The [[models]] section is only for short names, prices, and the mode chains.
# discover = "none" turns the model search off for a provider
# (other values: ollama | gemini | anthropic | openai; by default it is guessed from base_url).

[[providers]]
name = "ollama"
kind = "openai"
base_url = "http://127.0.0.1:11434/v1"

# Ollama cloud (ollama.com): uses the key you add for "ollama" on the /keys page
# (create one at https://ollama.com/settings/keys). Models installed locally and cloud
# models both show up in /models. Without a key this provider is skipped silently.
[[providers]]
name = "ollama-cloud"
kind = "openai"
base_url = "https://ollama.com/v1"
key_from = "ollama"

[[providers]]
name = "llamacpp"
kind = "openai"
base_url = "http://127.0.0.1:8080/v1"

[[providers]]
name = "anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com"

[[providers]]
name = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"

[[providers]]
name = "gemini"
kind = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"

[[providers]]
name = "openrouter"
kind = "openai"
base_url = "https://openrouter.ai/api/v1"

# ------------------------------------------------------------------- models
# price_in / price_out: USD per 1M tokens (used for cost tracking, fill in yourself)
# tools = true: the model can call tools (required for agent mode)
# Model names change often: if a provider answers "model not found", pick another
# one with /models. A model of a local server that is not installed (for example
# local-small below when you have not pulled it) is skipped: the mode uses the models
# that are installed instead.

[[models]]
id = "local-small"
provider = "ollama"
model = "qwen2.5-coder:7b"
tier = "small"
tools = true
context = 32768

[[models]]
id = "haiku"
provider = "anthropic"
model = "claude-haiku-5-5"
tier = "small"
tools = true
context = 200000

[[models]]
id = "sonnet"
provider = "anthropic"
model = "claude-sonnet-5-5"
tier = "medium"
tools = true
context = 200000

[[models]]
id = "opus"
provider = "anthropic"
model = "claude-opus-5-5"
tier = "hard"
tools = true
context = 200000

[[models]]
id = "gpt"
provider = "openai"
model = "gpt-5.5"
tier = "hard"
tools = true
context = 200000

[[models]]
id = "gemini-flash"
provider = "gemini"
model = "gemini-3.5-flash"
tier = "small"
tools = true
context = 200000

[[models]]
id = "openrouter-auto"
provider = "openrouter"
model = "openrouter/auto"
tier = "medium"
tools = true
context = 128000

# ------------------------------------------------------------------- modes
# A mode defines the UI/mascot color and the model chain: if the first model is
# unavailable (rate limit, server error, no key), the next one is used.

[modes.small]
models = ["local-small", "haiku", "gemini-flash"]
max_steps = 10

[modes.medium]
models = ["sonnet", "gpt", "gemini-flash", "openrouter-auto", "haiku"]
max_steps = 16

[modes.hard]
models = ["opus", "gpt", "sonnet", "gemini-flash"]
max_steps = 24

[modes.maximum]
models = ["opus", "gpt", "sonnet", "gemini-flash"]
max_steps = 40

# ---------------------------------------------------------- local processes
# Launcher: start and stop local servers from the UI (/start, /stop).
# If the server is already running (for example the system Ollama service),
# Relay attaches to it and does not start a second copy.

[[processes]]
name = "ollama"
command = "ollama"
args = ["serve"]
ready_url = "http://127.0.0.1:11434/api/tags"
autostart = false

