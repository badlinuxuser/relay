# ------------------------------------------------------------ MCP-серверы
# Инструменты MCP становятся доступны агенту (каждый вызов требует подтверждения).

# [[mcp]]
# name = "fs"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/dir"]

# ----------------------------------------------------- системные промпты
[[presets]]
name = "coder"
prompt = "You are a careful senior software engineer. Prefer small, correct changes. Explain briefly."

[[presets]]
name = "concise"
prompt = "Answer as concisely as possible."
