<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay · API keys</title>
<style>
:root{--bg:#0C1510;--card:#14201A;--line:#25402F;--accent:#67DD5D;--text:#E6E8EA;--dim:#8A948D;--red:#F26D6D;--soft:#2E8B3E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{max-width:780px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;align-items:center;gap:18px;margin-bottom:22px}
header img{width:132px;height:108px;image-rendering:pixelated}
h1{margin:0;font-size:24px;color:var(--accent)}
h1 small{color:var(--dim);font-weight:400;font-size:14px}
p.lead{margin:6px 0 0;color:var(--dim)}
.banner{display:none;margin:0 0 16px;padding:12px 14px;border:1px solid var(--red);border-radius:8px;color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kind{font-size:12px;color:var(--dim);font-weight:400}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.badge.ok{color:var(--accent);border-color:var(--soft)}
.badge.bad{color:var(--red);border-color:var(--red)}
.keys{margin:12px 0 0;padding:0;list-style:none}
.keys li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.keys .hint{color:var(--text)}
.keys .label{color:var(--dim);flex:1}
.keys .env{color:var(--dim)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--soft);background:transparent;color:var(--accent);padding:6px 12px}
button:hover{background:#1c3326}
button.del{border-color:var(--line);color:var(--dim);padding:3px 9px}
button.del:hover{color:var(--red);border-color:var(--red);background:transparent}
form{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
input{font:inherit;background:#0e1812;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus{outline:none;border-color:var(--accent)}
input.key{flex:1 1 280px}
input.lbl{flex:0 1 150px}
a{color:var(--accent)}
h3.group{margin:22px 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
h3.group:first-child{margin-top:0}
.hintline{margin:10px 0 0;font-size:13px;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card);border:1px solid var(--soft);color:var(--accent);padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#toast.err{border-color:var(--red);color:var(--red)}
.launch{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.launch h3{margin:0 0 8px;font-size:14px;color:var(--dim);font-weight:600}
.lrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.lrow .lab{color:var(--dim);min-width:84px}
.lrow input.arg{flex:1 1 260px}
.sw{position:relative;width:44px;height:24px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:#1c2b22;border:1px solid var(--line);transition:.15s;pointer-events:none}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:.15s}
.sw input:checked+i{background:#1c3326;border-color:var(--soft)}
.sw input:checked+i:before{left:23px;background:var(--accent)}
footer{margin-top:26px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<main>
  <header>
    <img alt="Relay" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALAAAACQCAYAAACoG+FoAAAMGUlEQVR42u2de1CU1xnGF1gWF1dYLyABVIgXEEOgqVU02lRjtNXY2tj8YZoab+2Yi61JY6bpNHF0cusl1STWmGmiJtPGSVOrJrXRNLVNsZHYXNB4VxQQBUFx2awLLMvSf/s8zJxvPhFk4fn99/id77Lfvp559uU973E4hBBCCCGEEEIIIYQQQvRkYnrbB3a6nG3/ryPhiHF8rDO2U58nHArHKAyvnli9AqEAFkIBLEQv9MDxia42O+MT+7rxfLcLdFJSX/wfnhgH2hObaLx+IBIEHQm2gvb7r4Cur7oEOq6P03j9lmBInlkzsFAAC6EAFqJjOKPuf1xsbJvJ0yYnJYFu8PtBDxzcH/Sg9AGgXU0J6ImTPaAvJJFnrcPnG+BIBh2KbTF66oAvgOMDzbY8f2/3xJqBhQJYCAWwEFfBdfdP7Olam8LG8f0G9gOdkj0I9C0Fuegxa0Kg/Q0B4/Urz1WBLlgwwjj+8t+bjJ6Zsbr/+fpq4/HyI5XG45FIpFd5Ys3AQgEshAJYiKugy/PAVp6XPS7XKowrKATtSXMZ78fH/Q14vHEI5l1dTTh+We4P0OOmpoDOWnwT6ERPX3tfgBPv98XJYtBtPhz/6BPPgD5Wfgp0fdWltt7kiTUDCwWwEApgIa6CLvdHXMvAZGZngB6akWm8XnrOAOPx8grMqw6ejLUK+35/CPSnu/4KurquFnTeV8Zf0/dxueoM6P6Z2UaPXFd+HPSmbW+CXv3ES8b79TRPrBlYKICFUAAL0R09MHtezvNy/S57XqvaAivixmGeuXU/pr6Xz58HetKsu0CHw1hLEQzgmja7ed+OemKr8SvWrAb959few++D+lxEe18KzcBCFkIIBbAQ0eiBs4cPBZ2eknZNPa+7Evs4LJk+F3TRjDtBW+VdrTxpR7F7/1CkEfSV8zWgv790OeiP9n6M74v6UETbGjvNwEIWQggFsBDdwQNb1Tpk5aHnzc0eaev6vKaM15D1L8DaCO7bMPO2ycbrL/zuPaATvKmg7eZ92aO6Yt22PLDfdxl0s6/W6Ik5T11+Ems97nlwGejKE7gGMNrywpqBhSyEEApgIa6CDq+J4zVucU7qp+vFWoYkT78O3S8QQg/MvcbSc7Het3BGDujt6/egxwx8abzf0oXLjR7ViqCPaie89s5P8mIvt4PkadkDs0fPGolr9sZOGIMe2aLPhGZgIRTAQiiAhTywNQkJ5j0nGM7rcv0vHx+Vj3nk+5+dDnrf8QOgJ+SMBu0ejvW9e587C3rN2s2gOS/sIE/KcP0w522tzre6HsP1wH3T04yeOC8Le70NyBwIuuFiQ1T1H9YMLGQhhFAAC9EdPDDDeV9XUjzokAN7k11sRl1zrs7okV9+/H3Q3AfCsdJBnrgAdGnaBdC8Rs+uJ+VahOOHD4O2W0/M19tZsRP05NpxoG/m2g3KO7On319yBPSeD/eCbtEMLIQCWAgFsJAHbke7PS2ubZsER7ClyXicPe8v37zPON7SMxNcD9zuBVJtRLPvjK3x7Km5fpjzyHFnaR+7SSnG8Zx35jzxik24JvDEzNP4fkorIC/c3eqFNQMLWQghFMBCdIUH7pPkxj0uwq1wnPdt47yvFfU+3MTikS2z0ePO2Qqa+0qwx+VaiZzJQ0Dv2b0fNPcHZtijXi5Hz8v9hO0SDkZAcx6Z87jcH/ibk6aBtso731hbBHreQ0dB/43ez4G3D3YrT6wZWMhCCKEAFqIrPDB73rYwerZIEI87vObrhfz41/bRs9HT/mgMFjOUzsHahXfewjVuZ8pwjVfj0CDowmE5xufhvC/3VbghJdXoefm4FVZ535wxuIYtw2uec/y1dcbj3DuN4XppJob6CztCmoGFUAALBbAQvcADU+2Dy5Ngz/OR562v84H+Ve7D     <div>
      <h1>Relay <small>· API keys</small></h1>
      <p class="lead">Keys are stored only on this computer (keys.json, readable only by you) and apply immediately, no restart needed.</p>
    </div>
  </header>
  <div class="banner" id="banner"></div>
  <div id="list"></div>
  <footer>Need help? <a href="/ui/help">Open the Relay help</a>. You can close this tab when you are done.</footer>
</main>
<div id="toast"></div>
<script>
(function(){
  var LINKS = {
    anthropic:['https://console.anthropic.com/settings/keys','Anthropic Console'],
    openai:['https://platform.openai.com/api-keys','OpenAI Platform'],
    openrouter:['https://openrouter.ai/keys','OpenRouter'],
    gemini:['https://aistudio.google.com/apikey','Google AI Studio'],
    ollama:['https://ollama.com/settings/keys','Ollama (cloud keys)'],
    grok:['https://console.x.ai','xAI Console'],
    deepseek:['https://platform.deepseek.com/api_keys','DeepSeek Platform']
  };
  var NOTES = {
    ollama:'Local models need no key. A key from ollama.com also unlocks the Ollama cloud models.'
  };
  var badges = {};
  var q = new URLSearchParams(location.hash.slice(1));
  var token = q.get('token') || sessionStorage.getItem('relay_token') || '';
  if (q.get('token')) { sessionStorage.setItem('relay_token', token); history.replaceState(null, '', location.pathname); }

  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
  function toast(msg, err){ var t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(err?' err':''); clearTimeout(toast.t); toast.t=setTimeout(function(){t.className='';},2600); }
  function banner(msg){ var b=document.getElementById('banner'); b.textContent=msg; b.style.display=msg?'block':'none'; }

  function api(method, path, body){
    return fetch(path, {method:method, headers:Object.assign({'Authorization':'Bearer '+token}, body?{'Content-Type':'application/json'}:{}), body: body?JSON.stringify(body):undefined})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){
        if(!r.ok){ var e=new Error((j.error&&j.error.message)||('HTTP '+r.status)); e.status=r.status; throw e; }
        return j; }); });
  }

  function badge(p){
    if(!p.needs_key && p.total===0) return el('span','badge','local, no key needed');
    if(p.total===0) return el('span','badge bad','no keys');
    return el('span','badge ok','keys: '+p.total+(p.available<p.total?' (available '+p.available+')':''));
  }

  // one line about the models found for a provider (r is the answer of /api/models)
  function modelsText(r, name){
    var by = {}; (r.providers||[]).forEach(function(x){ by[x.name]=x; });
    function one(x, label){
      if(!x) return null;
      if(x.error){
        // a local server that is simply not started is not a problem
        if(x.local && x.error.indexOf('not reachable')===0) return {t:label+': not running', bad:false, dim:true};
        return {t:label+': '+x.error, bad:true};
      }
      if(x.skipped) return null;
      return {t:label+': '+x.count+' model'+(x.count===1?'':'s'), bad:false};
    }
    var parts = [];
    if(name==='ollama'){
      parts.push(one(by['ollama'],'local'));
      parts.push(one(by['ollama-cloud'],'cloud'));
    } else { parts.push(one(by[name],'models')); }
    parts = parts.filter(function(x){ return x; });
    if(!parts.length) return null;
    return {t:parts.map(function(x){return x.t;}).join(' · '), bad:parts.some(function(x){return x.bad;}),
            dim:parts.every(function(x){return x.dim;})};
  }

  function fillModels(r){
    Object.keys(badges).forEach(function(name){
      var m = modelsText(r, name), b = badges[name];
      if(!m){ b.style.display='none'; return; }
      b.textContent = m.t; b.className = 'badge'+(m.dim?'':(m.bad?' bad':' ok')); b.style.display='';
    });
  }

  function loadModels(refresh){
    return api('GET','/api/models'+(refresh?'?refresh=1':'')).then(function(r){ fillModels(r); return r; });
  }

  var appSettings = null, procs = {};
  function saveApp(msg){
    return api('POST','/api/settings',appSettings).then(function(v){ appSettings=v.settings; toast(msg||'Saved'); }).catch(function(e){ fail(e); });
  }
  // Launcher controls of a local server that Relay can start (Ollama, llama.cpp): autostart, arguments, start and stop.
  function launcher(c, p){
    var pr = procs[p.name]; if(!pr || !appSettings) return;
    var box = el('div','launch'); box.appendChild(el('h3',null,'Launcher · '+pr.command));
    var r1 = el('div','lrow'); r1.appendChild(el('span','lab','autostart'));
    var sw = el('label','sw'), cb = el('input'); cb.type='checkbox'; cb.checked=!!pr.autostart;
    cb.onchange=function(){ appSettings.autostart[p.name]=cb.checked; pr.autostart=cb.checked; saveApp('Saved. Applies the next time the backend starts.'); };
    sw.appendChild(cb); sw.appendChild(el('i')); r1.appendChild(sw); box.appendChild(r1);
    var r2 = el('div','lrow'); r2.appendChild(el('span','lab', p.name==='llamacpp' ? 'model' : 'arguments'));
    var arg = el('input','arg'); arg.type='text'; arg.spellcheck=false;
    arg.placeholder = p.name==='llamacpp' ? 'path to a .gguf file, or org/repo from Hugging Face' : 'extra arguments (optional)';
    arg.value = (appSettings.process_args||{})[p.name] || '';
    arg.onchange=function(){ appSettings.process_args[p.name]=arg.value.trim(); saveApp(); };
    r2.appendChild(arg); box.appendChild(r2);
    var r3 = el('div','lrow');
    var st = el('button',null,'Start'); st.type='button';
    st.onclick=function(){ api('POST','/api/processes/'+encodeURIComponent(p.name)+'/start').then(function(r){ toast(r.already?p.name+' is already running':'Starting '+p.name+'…'); }).catch(function(e){ toast(e.message,true); }); };
    var sp = el('button','del','Stop'); sp.type='button';
    sp.onclick=function(){ api('POST','/api/processes/'+encodeURIComponent(p.name)+'/stop').then(function(){ toast('Stopped '+p.name); }).catch(function(e){ toast(e.message,true); }); };
    r3.appendChild(st); r3.appendChild(sp); box.appendChild(r3);
    box.appendChild(el('p','hintline','Arguments are used when the server is started without any: from the interface with /'+p.name+', or by autostart.'));
    c.appendChild(box);
  }

  function card(p){
    var c = el('section','card');
    var h = el('h2'); h.appendChild(document.createTextNode(p.name)); h.appendChild(el('span','kind',p.kind)); h.appendChild(badge(p));
    var mb = el('span','badge',''); mb.style.display='none'; badges[p.name]=mb; h.appendChild(mb); c.appendChild(h);
    var ul = el('ul','keys');
    p.stored.forEach(function(k){
      var li = el('li'); li.appendChild(el('span','hint',k.hint)); li.appendChild(el('span','label',''));
      var d = el('button','del','delete'); d.type='button';
      d.onclick=function(){ if(!confirm('Delete key '+k.hint+' ('+p.name+')?')) return;
        api('DELETE','/api/keys/'+encodeURIComponent(p.name)+'/'+encodeURIComponent(k.id)).then(function(){toast('Key deleted');load();}).catch(fail); };
      li.appendChild(d); ul.appendChild(li);
    });
    if(ul.children.length) c.appendChild(ul);

    if(!p.needs_key && !p.key_optional){
      c.appendChild(el('p','hintline','A server on this computer: it needs no API key.'));
      launcher(c, p);
      return c;
    }
    var f = el('form'); 
    var key = el('input','key'); key.type='password'; key.placeholder='paste your key'; key.autocomplete='off'; key.spellcheck=false;
    var b = el('button',null,'Add'); b.type='submit';
    f.appendChild(key); f.appendChild(b);
    f.onsubmit=function(ev){ ev.preventDefault(); if(!key.value.trim()) return;
      api('POST','/api/keys',{provider:p.name,key:key.value}).then(function(){
        key.value=''; toast('Key saved. Checking models…'); load();
        // ask the provider what the key gives access to: this also checks that the key works
        return loadModels(true).then(function(r){
          var m = modelsText(r, p.name);
          toast('Key saved'+(m?' · '+m.t:''), !!(m&&m.bad));
        });
      }).catch(fail); };
    c.appendChild(f);
    launcher(c, p);
    if(NOTES[p.name]){ c.appendChild(el('p','hintline',NOTES[p.name])); }
    if(LINKS[p.name]){ var hl = el('p','hintline'); hl.appendChild(document.createTextNode('Get a key: ')); var a=el('a',null,LINKS[p.name][1]); a.href=LINKS[p.name][0]; a.target='_blank'; a.rel='noopener noreferrer'; hl.appendChild(a); c.appendChild(hl); }
    return c;
  }

  function fail(e){ if(e.status===401){ banner('No access. Open this page with the “relay keys” command or /keys in the interface.'); } else { toast(e.message,true); } }

  function load(){
    if(!token){ banner('No access token. Open this page with the “relay keys” command or /keys in the interface.'); return; }
    api('GET','/api/settings').then(function(v){ appSettings=v.settings; procs={}; (v.processes||[]).forEach(function(x){ procs[x.name]=x; }); }).catch(function(){ appSettings=null; }).then(function(){ return api('GET','/api/keys'); }).then(function(r){
      banner('');
      var list = document.getElementById('list'); list.textContent='';
      badges = {};
      var TITLES = {official:'Official providers', external:'Other services', local:'On this computer'}, lastGroup = '';
      r.providers.forEach(function(p){
        if(p.group && p.group!==lastGroup){ lastGroup=p.group; list.appendChild(el('h3','group',TITLES[p.group]||p.group)); }
        list.appendChild(card(p));
      });
      loadModels(false).catch(function(){}); // how many models each provider has (does not block the page)
    }).catch(fail);
  }
  load();
})();
</script>
</body>
</html>
