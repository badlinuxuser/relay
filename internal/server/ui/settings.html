<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay · Settings</title>
<style>
:root{--bg:#0C1510;--card:#14201A;--line:#25402F;--accent:#67DD5D;--text:#E6E8EA;--dim:#8A948D;--red:#F26D6D;--soft:#2E8B3E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{max-width:780px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;align-items:center;gap:18px;margin-bottom:22px}
header img{width:132px;height:108px;image-rendering:pixelated}
h1{margin:0;font-size:24px;color:var(--accent)}
h1 small{color:var(--dim);font-weight:400;font-size:14px}
p.lead{margin:6px 0 0;color:var(--dim)}
.banner{display:none;margin:0 0 16px;padding:12px 14px;border:1px solid var(--red);border-radius:8px;color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kind{font-size:12px;color:var(--dim);font-weight:400}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.badge.ok{color:var(--accent);border-color:var(--soft)}
.badge.bad{color:var(--red);border-color:var(--red)}
.keys{margin:12px 0 0;padding:0;list-style:none}
.keys li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.keys .hint{color:var(--text)}
.keys .label{color:var(--dim);flex:1}
.keys .env{color:var(--dim)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--soft);background:transparent;color:var(--accent);padding:6px 12px}
button:hover{background:#1c3326}
button.del{border-color:var(--line);color:var(--dim);padding:3px 9px}
button.del:hover{color:var(--red);border-color:var(--red);background:transparent}
form{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
input{font:inherit;background:#0e1812;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus{outline:none;border-color:var(--accent)}
input.key{flex:1 1 280px}
input.lbl{flex:0 1 150px}
a{color:var(--accent)}
.hintline{margin:10px 0 0;font-size:13px;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card);border:1px solid var(--soft);color:var(--accent);padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#toast.err{border-color:var(--red);color:var(--red)}
footer{margin-top:26px;color:var(--dim);font-size:13px}

header img{display:none}
.row{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1}
.row .t b{display:block;font-weight:600}
.row .t span{color:var(--dim);font-size:13px}
select,input.num,input.arg{font:inherit;background:#0e1812;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
input.arg{flex:1 1 260px;min-width:0}
input.num{width:92px}
.sw{position:relative;width:44px;height:24px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:#1c2b22;border:1px solid var(--line);transition:.15s;pointer-events:none}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:.15s}
.sw input:checked+i{background:#1c3326;border-color:var(--soft)}
.sw input:checked+i:before{left:23px;background:var(--accent)}
.sess{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.sess .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .meta{color:var(--dim);font-size:12px;white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:8px;margin:0 0 16px}
.tabs button{border-color:var(--line);color:var(--dim)}
.tabs button.on{border-color:var(--soft);color:var(--accent);background:#1c3326}
.lang{position:fixed;top:10px;right:12px;display:flex;gap:4px;z-index:5}
.lang button{padding:3px 9px;font-size:12px;border-color:var(--line);color:var(--dim)}
.lang button.on{color:var(--accent);border-color:var(--soft)}
</style>
</head>
<body>
<div class="lang" id="lang"></div>
<main>
  <header>
    <div>
      <h1>Relay <small>· <span data-t="Settings">Settings</span></small></h1>
      <p class="lead" data-t="Changes are saved at once and reach the interface within a few seconds. Providers, models and modes are still edited in config.toml.">Changes are saved at once and reach the interface within a few seconds. Providers, models and modes are still edited in config.toml.</p>
    </div>
  </header>
  <div class="banner" id="banner"></div>
  <nav class="tabs"><button type="button" id="tab-general" data-t="General">General</button><button type="button" id="tab-sessions" data-t="Sessions">Sessions</button></nav>
  <div id="root"></div>
  <footer><span data-t="Need help?">Need help?</span> <a href="/ui/help" data-t="Open the Relay help">Open the Relay help</a>. <span data-t="API keys live on">API keys live on</span> <a href="#" id="keyslink" data-t="their own page">their own page</a>. <span data-t="You can close this tab when you are done.">You can close this tab when you are done.</span></footer>
</main>
<div id="toast"></div>
<script>
(function(){
  var RU = {
    'Settings':'Настройки','Relay · Settings':'Relay · Настройки','General':'Основные','Sessions':'Сессии',
    'Changes are saved at once and reach the interface within a few seconds. Providers, models and modes are still edited in config.toml.':'Изменения сохраняются сразу и доходят до интерфейса за несколько секунд. Провайдеры, модели и режимы по-прежнему правятся в config.toml.',
    'Need help?':'Нужна помощь?','Open the Relay help':'Открыть справку Relay','API keys live on':'Ключи API находятся на','their own page':'отдельной странице','You can close this tab when you are done.':'Когда закончите, вкладку можно закрыть.',
    'No access. Open this page with /settings in the interface.':'Нет доступа. Откройте страницу командой /settings в интерфейсе.',
    'Saved':'Сохранено','No saved sessions.':'Сохранённых сессий нет.','(empty)':'(пусто)','msg':'сообщ.','tok':'ток.','delete':'удалить','Session deleted':'Сессия удалена',
    'Delete empty sessions':'Удалить пустые сессии','Deleted {0}':'Удалено: {0}','Delete all sessions':'Удалить все сессии','Delete ALL saved sessions? This cannot be undone.':'Удалить ВСЕ сохранённые сессии? Это нельзя отменить.',' · skipped {0} (busy)':' · пропущено: {0} (заняты)',
    'Every conversation is saved with its tokens and cost. Delete the ones you do not need; a session that is answering right now cannot be deleted.':'Каждый разговор сохраняется вместе с токенами и стоимостью. Удалите ненужные; сессию, которая сейчас отвечает, удалить нельзя.',
    'Chat':'Чат','Show the model\u2019s thoughts':'Показывать рассуждения модели','Reasoning is shown dimmed and set apart from the answer. When off, it is not sent to the interface at all.':'Рассуждения показываются приглушённо и отдельно от ответа. Если выключить, в интерфейс они не отправляются вообще.',
    'Typing speed':'Скорость печати','How fast the answer is typed out. The answer is received at the network speed either way.':'Как быстро ответ «печатается» на экране. Сам ответ в любом случае приходит со скоростью сети.',
    'Instant':'Мгновенно','Fast':'Быстро','Normal':'Обычно','Slow':'Медленно',
    'Agent: tools and skills':'Агент: инструменты и навыки','The agent can build its own tools, connectors and skills.':'Агент может создавать собственные инструменты, коннекторы и навыки.',
    'While the agent builds':'Пока агент создаёт','Progress: a progress bar with the stage (writing the code, checking, starting, writing the skill) instead of the model\u2019s reasoning. Thoughts: show the reasoning and the answer as usual.':'Прогресс: полоса с этапом (пишет код, проверяет, запускает, пишет навык) вместо рассуждений модели. Мысли: рассуждения и ответ показываются как обычно.',
    'Progress bar':'Полоса прогресса','Thoughts and answers':'Мысли и ответы',
    'Offer to build what is missing':'Предлагать создать недостающее','When you ask for something that no tool or skill can do, the agent offers to build one. If you decline, it does the task as well as it can without it.':'Если вы просите то, чего не умеет ни один инструмент или навык, агент предложит создать нужный. Если вы откажетесь, он сделает задачу как сможет без него.',
    'Interface':'Интерфейс','Side panel':'Боковая панель','The panel with the mascot, mode, model, tokens and running processes.':'Панель с маскотом, режимом, моделью, токенами и запущенными процессами.',
    'Show when the window is wide':'Показывать, когда окно широкое','Hide':'Скрыть','Mascot':'Маскот','Draw the mascot in the side panel.':'Рисовать маскота в боковой панели.',
    'Text width':'Ширина текста','Wrap the chat at this many columns (40 to 240). 0 uses the whole width.':'Переносить чат по этому числу столбцов (от 40 до 240). 0 использует всю ширину.',
    'Mouse in the interface':'Мышь в интерфейсе','On: click the lists and scroll with the wheel. Off: select and copy text with the mouse as in any terminal (scroll with pgup/pgdn or shift+up/down). With it on, press f2 (or type /select) to freeze the screen, then select text with the mouse.':'Включена: клики по спискам и прокрутка колесом. Выключена: текст выделяется и копируется мышью, как в любом терминале (прокрутка pgup/pgdn или shift+вверх/вниз). Когда включена, нажмите f2 (или введите /select), чтобы заморозить экран, и выделяйте текст мышью.',
    'Launcher':'Запуск серверов','Local servers from config.toml. Start them from the interface with /ollama or /llamacpp, stop with /stop.':'Локальные серверы из config.toml. Запускайте их из интерфейса командами /ollama и /llamacpp, останавливайте командой /stop.',
    'Default mode':'Режим по умолчанию','The mode new sessions start in.':'Режим, в котором начинаются новые сессии.','From config.toml':'Из config.toml',
    'Keep the backend running':'Не останавливать сервер','Do not stop the background service when the interface quits.':'Не останавливать фоновую службу при выходе из интерфейса.',
    'Ollama and llama.cpp (autostart, the model file, start and stop) are set on the keys page, on their own cards.':'Ollama и llama.cpp (автозапуск, файл модели, запуск и остановка) настраиваются на странице ключей, на их карточках.',
    'No access token. Open this page with /settings in the interface.':'Нет токена доступа. Откройте страницу командой /settings в интерфейсе.'
  };
  var LANG = (function(){ try{ var s=localStorage.getItem('relay_lang'); if(s==='ru'||s==='en') return s; }catch(e){} var m=document.cookie.match(/(?:^|; )relay_lang=(ru|en)/); if(m) return m[1]; return (navigator.language||'').toLowerCase().indexOf('ru')===0?'ru':'en'; })();
  function t(s){ var out=(LANG==='ru'&&RU[s]!==undefined)?RU[s]:s; for(var i=1;i<arguments.length;i++) out=out.split('{'+(i-1)+'}').join(arguments[i]); return out; }
  function setLang(l){ try{ localStorage.setItem('relay_lang',l); }catch(e){} document.cookie='relay_lang='+l+'; path=/; max-age=31536000; SameSite=Strict'; location.reload(); }
  function applyStatic(title){
    document.documentElement.lang=LANG;
    var tt=document.querySelectorAll('[data-t]'); for(var i=0;i<tt.length;i++){ tt[i].textContent=t(tt[i].getAttribute('data-t')); }
    var box=document.getElementById('lang'); box.textContent='';
    ['en','ru'].forEach(function(l){ var b=document.createElement('button'); b.type='button'; b.textContent=l.toUpperCase(); b.className=l===LANG?'on':''; b.onclick=function(){ setLang(l); }; box.appendChild(b); });
    if(title) document.title=t(title);
  }
  var q = new URLSearchParams(location.hash.slice(1));
  var token = q.get('token') || sessionStorage.getItem('relay_token') || '';
  if (q.get('token')) { sessionStorage.setItem('relay_token', token); history.replaceState(null, '', location.pathname); }
  document.getElementById('keyslink').onclick=function(e){ e.preventDefault(); location.href='/ui/keys'; };

  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
  function toast(msg, err){ var t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(err?' err':''); clearTimeout(toast.t); toast.t=setTimeout(function(){t.className='';},2200); }
  function banner(msg){ var b=document.getElementById('banner'); b.textContent=msg; b.style.display=msg?'block':'none'; }
  function api(method, path, body){
    return fetch(path, {method:method, headers:Object.assign({'Authorization':'Bearer '+token}, body?{'Content-Type':'application/json'}:{}), body: body?JSON.stringify(body):undefined})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){
        if(!r.ok){ var e=new Error((j.error&&j.error.message)||('HTTP '+r.status)); e.status=r.status; throw e; }
        return j; }); });
  }
  function fail(e){ if(e.status===401){ banner(t('No access. Open this page with /settings in the interface.')); } else { toast(e.message,true); } }

  var view = null;
  // The controls hold on to view.settings, so it must stay the same object: copy the answer into it.
  function adopt(v){ Object.keys(view.settings).forEach(function(k){ delete view.settings[k]; }); Object.assign(view.settings, v.settings); view.modes=v.modes; view.processes=v.processes; }
  function save(msg){
    return api('POST','/api/settings',view.settings).then(function(v){ adopt(v); toast(msg||t('Saved')); }).catch(function(e){ fail(e); load(); });
  }

  function card(title, note){ var c=el('section','card'); c.appendChild(el('h2',null,title)); if(note) c.appendChild(el('p','hintline',note)); return c; }
  function row(c, title, desc, ctl){
    var r=el('div','row'), t=el('div','t'); t.appendChild(el('b',null,title)); if(desc) t.appendChild(el('span',null,desc));
    r.appendChild(t); r.appendChild(ctl); c.appendChild(r); return r;
  }
  function toggle(get, set){
    var w=el('label','sw'), i=el('input'); i.type='checkbox'; i.checked=!!get(); i.onchange=function(){ set(i.checked); save(); };
    w.appendChild(i); w.appendChild(el('i')); return w;
  }
  function select(opts, get, set){
    var s=el('select'); opts.forEach(function(o){ var op=el('option',null,o[1]); op.value=o[0]; s.appendChild(op); });
    s.value=get(); s.onchange=function(){ set(s.value); save(); }; return s;
  }

  function sessions(c, list){
    var box=el('div'); c.appendChild(box);
    function draw(list){
      box.textContent='';
      if(!list.length){ box.appendChild(el('p','hintline',t('No saved sessions.'))); return; }
      list.forEach(function(s){
        var r=el('div','sess');
        r.appendChild(el('span','ti',s.title||t('(empty)')));
        r.appendChild(el('span','meta',s.mode+' · '+s.messages+' '+t('msg')+' · '+(s.tokens_in+s.tokens_out)+' '+t('tok')+' · $'+(s.cost||0).toFixed(4)+' · '+new Date(s.updated).toLocaleString()));
        var d=el('button','del',t('delete')); d.type='button';
        d.onclick=function(){ api('DELETE','/api/sessions/'+encodeURIComponent(s.id)).then(function(){ toast(t('Session deleted')); refresh(); }).catch(fail); };
        r.appendChild(d); box.appendChild(r);
      });
    }
    function refresh(){ api('GET','/api/session-list').then(draw).catch(fail); }
    var b=el('div','btns');
    var e=el('button',null,t('Delete empty sessions')); e.type='button';
    e.onclick=function(){ api('POST','/api/sessions/prune',{which:'empty'}).then(function(r){ toast(t('Deleted {0}',r.deleted)); refresh(); }).catch(fail); };
    var a=el('button','del',t('Delete all sessions')); a.type='button';
    a.onclick=function(){ if(!confirm(t('Delete ALL saved sessions? This cannot be undone.'))) return;
      api('POST','/api/sessions/prune',{which:'all'}).then(function(r){ toast(t('Deleted {0}',r.deleted)+(r.skipped?t(' · skipped {0} (busy)',r.skipped):'')); refresh(); }).catch(fail); };
    b.appendChild(e); b.appendChild(a); c.appendChild(b);
    refresh();
  }

  var tab = (location.hash==='#sessions') ? 'sessions' : 'general';
  function setTab(t){ tab=t; history.replaceState(null,'',location.pathname+(t==='sessions'?'#sessions':'')); if(view) render(); }
  document.getElementById('tab-general').onclick=function(){ setTab('general'); };
  document.getElementById('tab-sessions').onclick=function(){ setTab('sessions'); };

  function render(){
    var root=document.getElementById('root'); root.textContent='';
    document.getElementById('tab-general').className = tab==='general'?'on':'';
    document.getElementById('tab-sessions').className = tab==='sessions'?'on':'';
    var s=view.settings;
    if(tab==='sessions'){ var sc=card(t('Sessions'),t('Every conversation is saved with its tokens and cost. Delete the ones you do not need; a session that is answering right now cannot be deleted.')); sessions(sc); root.appendChild(sc); return; }

    var c=card(t('Chat'));
    row(c,t('Show the model\u2019s thoughts'),t('Reasoning is shown dimmed and set apart from the answer. When off, it is not sent to the interface at all.'),
      toggle(function(){return s.show_thoughts;}, function(v){s.show_thoughts=v;}));
    row(c,t('Typing speed'),t('How fast the answer is typed out. The answer is received at the network speed either way.'),
      select([['instant',t('Instant')],['fast',t('Fast')],['normal',t('Normal')],['slow',t('Slow')]], function(){return s.stream_speed;}, function(v){s.stream_speed=v;}));
    root.appendChild(c);

    c=card(t('Agent: tools and skills'),t('The agent can build its own tools, connectors and skills.'));
    row(c,t('While the agent builds'),t('Progress: a progress bar with the stage (writing the code, checking, starting, writing the skill) instead of the model\u2019s reasoning. Thoughts: show the reasoning and the answer as usual.'),
      select([['progress',t('Progress bar')],['thoughts',t('Thoughts and answers')]], function(){return s.builder_view;}, function(v){s.builder_view=v;}));
    row(c,t('Offer to build what is missing'),t('When you ask for something that no tool or skill can do, the agent offers to build one. If you decline, it does the task as well as it can without it.'),
      toggle(function(){return s.suggest_tools;}, function(v){s.suggest_tools=v;}));
    root.appendChild(c);

    c=card(t('Interface'));
    row(c,t('Side panel'),t('The panel with the mascot, mode, model, tokens and running processes.'),
      select([['auto',t('Show when the window is wide')],['hidden',t('Hide')]], function(){return s.sidebar;}, function(v){s.sidebar=v;}));
    row(c,t('Mascot'),t('Draw the mascot in the side panel.'),
      toggle(function(){return s.mascot;}, function(v){s.mascot=v;}));
    var n=el('input','num'); n.type='number'; n.min=0; n.max=240; n.value=s.text_width; n.onchange=function(){ s.text_width=parseInt(n.value||'0',10)||0; save(); };
    row(c,t('Text width'),t('Wrap the chat at this many columns (40 to 240). 0 uses the whole width.'), n);
    row(c,t('Mouse in the interface'),t('On: click the lists and scroll with the wheel. Off: select and copy text with the mouse as in any terminal (scroll with pgup/pgdn or shift+up/down). With it on, press f2 (or type /select) to freeze the screen, then select text with the mouse.'),
      toggle(function(){return s.mouse;}, function(v){s.mouse=v;}));
    root.appendChild(c);

    c=card(t('Launcher'),t('Local servers from config.toml. Start them from the interface with /ollama or /llamacpp, stop with /stop.'));
    row(c,t('Default mode'),t('The mode new sessions start in.'),
      select([['',t('From config.toml')]].concat(view.modes.map(function(m){return [m,m];})), function(){return s.default_mode||'';}, function(v){s.default_mode=v;}));
    row(c,t('Keep the backend running'),t('Do not stop the background service when the interface quits.'),
      toggle(function(){return s.keep_backend;}, function(v){s.keep_backend=v;}));
    c.appendChild(el('p','hintline',t('Ollama and llama.cpp (autostart, the model file, start and stop) are set on the keys page, on their own cards.')));
    root.appendChild(c);

  }

  function load(){
    if(!token){ banner(t('No access token. Open this page with /settings in the interface.')); return; }
    api('GET','/api/settings').then(function(v){ banner(''); view=v; render(); }).catch(fail);
  }
  applyStatic('Relay · Settings');
  load();
})();
</script>
</body>
</html>
