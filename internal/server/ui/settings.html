<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay · Settings</title>
<style>
:root{--bg:#0C1510;--card:#14201A;--line:#25402F;--accent:#67DD5D;--text:#E6E8EA;--dim:#8A948D;--red:#F26D6D;--soft:#2E8B3E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{max-width:780px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;align-items:center;gap:18px;margin-bottom:22px}
header img{width:132px;height:108px;image-rendering:pixelated}
h1{margin:0;font-size:24px;color:var(--accent)}
h1 small{color:var(--dim);font-weight:400;font-size:14px}
p.lead{margin:6px 0 0;color:var(--dim)}
.banner{display:none;margin:0 0 16px;padding:12px 14px;border:1px solid var(--red);border-radius:8px;color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0;font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kind{font-size:12px;color:var(--dim);font-weight:400}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.badge.ok{color:var(--accent);border-color:var(--soft)}
.badge.bad{color:var(--red);border-color:var(--red)}
.keys{margin:12px 0 0;padding:0;list-style:none}
.keys li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.keys .hint{color:var(--text)}
.keys .label{color:var(--dim);flex:1}
.keys .env{color:var(--dim)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--soft);background:transparent;color:var(--accent);padding:6px 12px}
button:hover{background:#1c3326}
button.del{border-color:var(--line);color:var(--dim);padding:3px 9px}
button.del:hover{color:var(--red);border-color:var(--red);background:transparent}
form{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
input{font:inherit;background:#0e1812;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus{outline:none;border-color:var(--accent)}
input.key{flex:1 1 280px}
input.lbl{flex:0 1 150px}
a{color:var(--accent)}
.hintline{margin:10px 0 0;font-size:13px;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card);border:1px solid var(--soft);color:var(--accent);padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#toast.err{border-color:var(--red);color:var(--red)}
footer{margin-top:26px;color:var(--dim);font-size:13px}

header img{display:none}
.row{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1}
.row .t b{display:block;font-weight:600}
.row .t span{color:var(--dim);font-size:13px}
select,input.num,input.arg{font:inherit;background:#0e1812;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
input.arg{flex:1 1 260px;min-width:0}
input.num{width:92px}
.sw{position:relative;width:44px;height:24px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:#1c2b22;border:1px solid var(--line);transition:.15s;pointer-events:none}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:.15s}
.sw input:checked+i{background:#1c3326;border-color:var(--soft)}
.sw input:checked+i:before{left:23px;background:var(--accent)}
.sess{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.sess .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .meta{color:var(--dim);font-size:12px;white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Relay <small>· Settings</small></h1>
      <p class="lead">Changes are saved at once and reach the interface within a few seconds. Providers, models and modes are still edited in config.toml.</p>
    </div>
  </header>
  <div class="banner" id="banner"></div>
  <div id="root"></div>
  <footer>Need help? <a href="/ui/help">Open the Relay help</a>. API keys live on <a href="#" id="keyslink">their own page</a>. You can close this tab when you are done.</footer>
</main>
<div id="toast"></div>
<script>
(function(){
  var q = new URLSearchParams(location.hash.slice(1));
  var token = q.get('token') || sessionStorage.getItem('relay_token') || '';
  if (q.get('token')) { sessionStorage.setItem('relay_token', token); history.replaceState(null, '', location.pathname); }
  document.getElementById('keyslink').onclick=function(e){ e.preventDefault(); location.href='/ui/keys'; };

  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
  function toast(msg, err){ var t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(err?' err':''); clearTimeout(toast.t); toast.t=setTimeout(function(){t.className='';},2200); }
  function banner(msg){ var b=document.getElementById('banner'); b.textContent=msg; b.style.display=msg?'block':'none'; }
  function api(method, path, body){
    return fetch(path, {method:method, headers:Object.assign({'Authorization':'Bearer '+token}, body?{'Content-Type':'application/json'}:{}), body: body?JSON.stringify(body):undefined})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){
        if(!r.ok){ var e=new Error((j.error&&j.error.message)||('HTTP '+r.status)); e.status=r.status; throw e; }
        return j; }); });
  }
  function fail(e){ if(e.status===401){ banner('No access. Open this page with /settings in the interface.'); } else { toast(e.message,true); } }

  var view = null;
  function save(msg){
    return api('POST','/api/settings',view.settings).then(function(v){ view=v; toast(msg||'Saved'); }).catch(function(e){ fail(e); load(); });
  }

  function card(title, note){ var c=el('section','card'); c.appendChild(el('h2',null,title)); if(note) c.appendChild(el('p','hintline',note)); return c; }
  function row(c, title, desc, ctl){
    var r=el('div','row'), t=el('div','t'); t.appendChild(el('b',null,title)); if(desc) t.appendChild(el('span',null,desc));
    r.appendChild(t); r.appendChild(ctl); c.appendChild(r); return r;
  }
  function toggle(get, set){
    var w=el('label','sw'), i=el('input'); i.type='checkbox'; i.checked=!!get(); i.onchange=function(){ set(i.checked); save(); };
    w.appendChild(i); w.appendChild(el('i')); return w;
  }
  function select(opts, get, set){
    var s=el('select'); opts.forEach(function(o){ var op=el('option',null,o[1]); op.value=o[0]; s.appendChild(op); });
    s.value=get(); s.onchange=function(){ set(s.value); save(); }; return s;
  }

  function sessions(c, list){
    var box=el('div'); c.appendChild(box);
    function draw(list){
      box.textContent='';
      if(!list.length){ box.appendChild(el('p','hintline','No saved sessions.')); return; }
      list.forEach(function(s){
        var r=el('div','sess');
        r.appendChild(el('span','ti',s.title||'(empty)'));
        r.appendChild(el('span','meta',s.mode+' · '+s.messages+' msg · '+new Date(s.updated).toLocaleString()));
        var d=el('button','del','delete'); d.type='button';
        d.onclick=function(){ api('DELETE','/api/sessions/'+encodeURIComponent(s.id)).then(function(){ toast('Session deleted'); refresh(); }).catch(fail); };
        r.appendChild(d); box.appendChild(r);
      });
    }
    function refresh(){ api('GET','/api/session-list').then(draw).catch(fail); }
    var b=el('div','btns');
    var e=el('button',null,'Delete empty sessions'); e.type='button';
    e.onclick=function(){ api('POST','/api/sessions/prune',{which:'empty'}).then(function(r){ toast('Deleted '+r.deleted); refresh(); }).catch(fail); };
    var a=el('button','del','Delete all sessions'); a.type='button';
    a.onclick=function(){ if(!confirm('Delete ALL saved sessions? This cannot be undone.')) return;
      api('POST','/api/sessions/prune',{which:'all'}).then(function(r){ toast('Deleted '+r.deleted+(r.skipped?(' · skipped '+r.skipped+' (busy)'):'')); refresh(); }).catch(fail); };
    b.appendChild(e); b.appendChild(a); c.appendChild(b);
    refresh();
  }

  function render(){
    var root=document.getElementById('root'); root.textContent='';
    var s=view.settings;

    var c=card('Chat');
    row(c,'Show the model\u2019s thoughts','Reasoning is shown dimmed and set apart from the answer. When off, it is not sent to the interface at all.',
      toggle(function(){return s.show_thoughts;}, function(v){s.show_thoughts=v;}));
    row(c,'Typing speed','How fast the answer is typed out. The answer is received at the network speed either way.',
      select([['instant','Instant'],['fast','Fast'],['normal','Normal'],['slow','Slow']], function(){return s.stream_speed;}, function(v){s.stream_speed=v;}));
    root.appendChild(c);

    c=card('Interface');
    row(c,'Side panel','The panel with the mascot, mode, model, tokens and running processes.',
      select([['auto','Show when the window is wide'],['hidden','Hide']], function(){return s.sidebar;}, function(v){s.sidebar=v;}));
    row(c,'Mascot','Draw the mascot in the side panel.',
      toggle(function(){return s.mascot;}, function(v){s.mascot=v;}));
    var n=el('input','num'); n.type='number'; n.min=0; n.max=240; n.value=s.text_width; n.onchange=function(){ s.text_width=parseInt(n.value||'0',10)||0; save(); };
    row(c,'Text width','Wrap the chat at this many columns (40 to 240). 0 uses the whole width.', n);
    row(c,'Mouse in the interface','On: click the lists and scroll with the wheel. Off: select and copy text with the mouse as in any terminal (scroll with pgup/pgdn). With it on, hold shift while dragging to select.',
      toggle(function(){return s.mouse;}, function(v){s.mouse=v;}));
    root.appendChild(c);

    c=card('Launcher','Local servers from config.toml. Start them from the interface with /ollama or /llamacpp, stop with /stop.');
    row(c,'Default mode','The mode new sessions start in.',
      select([['','From config.toml']].concat(view.modes.map(function(m){return [m,m];})), function(){return s.default_mode||'';}, function(v){s.default_mode=v;}));
    row(c,'Keep the backend running','Do not stop the background service when the interface quits.',
      toggle(function(){return s.keep_backend;}, function(v){s.keep_backend=v;}));
    view.processes.forEach(function(p){
      var box=el('div','row'), t=el('div','t'); t.appendChild(el('b',null,p.name)); t.appendChild(el('span',null,p.command));
      box.appendChild(t);
      var arg=el('input','arg'); arg.type='text'; arg.spellcheck=false;
      arg.placeholder = p.name==='llamacpp' ? 'arguments, e.g. -m /path/to/model.gguf' : 'extra arguments (optional)';
      arg.value=p.args||''; arg.onchange=function(){ s.process_args[p.name]=arg.value.trim(); save('Saved'); };
      box.appendChild(arg);
      var lab=el('span','meta','autostart'); lab.style.color='var(--dim)'; box.appendChild(lab);
      box.appendChild(toggle(function(){return p.autostart;}, function(v){s.autostart[p.name]=v; p.autostart=v;}));
      c.appendChild(box);
    });
    c.appendChild(el('p','hintline','Arguments are used when a server is started without any (for llama.cpp this is where its model file goes). Autostart applies the next time the backend starts.'));
    root.appendChild(c);

    c=card('Sessions','Every conversation is saved. Delete the ones you do not need; a session that is answering right now cannot be deleted.');
    sessions(c);
    root.appendChild(c);
  }

  function load(){
    if(!token){ banner('No access token. Open this page with /settings in the interface.'); return; }
    api('GET','/api/settings').then(function(v){ banner(''); view=v; render(); }).catch(fail);
  }
  load();
})();
</script>
</body>
</html>
